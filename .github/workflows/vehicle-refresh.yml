name: vehicle-data refresh

# Manual trigger (Actions tab -> Run workflow) or by pushing a change to vehicle-data/refresh.request.
# Scheduled runs are intentionally OFF until decisions D10 (cadence) and D14 (source ToS) are made;
# uncomment the schedule block to enable.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prices = model pages only; full = also trim pages (specs)"
        default: full
        type: choice
        options: [full, prices, triage, official]
  push:
    paths: ["vehicle-data/refresh.request"]
  pull_request:
    paths: ["vehicle-data/scripts/official_lineups.py", "vehicle-data/tests/**", "vehicle-data/config/official_lineups.json", ".github/workflows/vehicle-refresh.yml"]
  # schedule:
  #   - cron: "17 5 * * 0"   # weekly, Sunday 05:17 UTC

permissions:
  contents: write

concurrency:
  group: vehicle-refresh
  cancel-in-progress: false

jobs:
  official-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s vehicle-data/tests -v
  refresh:
    if: github.event_name != 'pull_request'
    needs: official-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests beautifulsoup4 pypdf
      - name: Refresh
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=$(awk 'NR==1{print $1}' vehicle-data/refresh.request); fi
          case "$MODE" in full|prices|triage|official) ;; *) MODE=full ;; esac
          if [ "$MODE" = official ]; then
            python3 vehicle-data/scripts/official_lineups.py --out vehicle-data/snapshots/official-lineups
            SNAP="vehicle-data/snapshots/official/O4_2026-10-12_${GITHUB_RUN_ID}"
            python3 vehicle-data/scripts/official_t1.py run --config vehicle-data/config/official_sources.json --out "$SNAP"
            python3 vehicle-data/scripts/asset_evidence.py --config vehicle-data/config/official_sources.json --snapshot "$SNAP" --pdf-limit 8
          else
            vehicle-data/scripts/refresh.sh "$MODE"
          fi
      - name: Upload raw pages (90-day artifact; evidence + parsed files are committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-pages-${{ github.run_id }}
          path: |
            vehicle-data/snapshots/*/raw/
            vehicle-data/snapshots/official-lineups/
            vehicle-data/snapshots/official/**/raw/
            vehicle-data/snapshots/official/**/brochures/
          retention-days: 90
          if-no-files-found: ignore
      - name: Commit snapshot and views
        run: |
          git config user.name "carindex-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vehicle-data/snapshots vehicle-data/views vehicle-data/review
          git reset -q -- 'vehicle-data/snapshots/*/raw'
          git commit -m "vehicle-data refresh $(date -u +%Y-%m-%d) [automated]" || echo "nothing to commit"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
