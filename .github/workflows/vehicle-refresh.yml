name: vehicle-data refresh

# Manual trigger (Actions tab -> Run workflow) or by pushing a change to vehicle-data/refresh.request.
# Scheduled runs are intentionally OFF until decisions D10 (cadence) and D14 (source ToS) are made;
# uncomment the schedule block to enable.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prices = model pages only; full = also trim pages (specs)"
        default: full
        type: choice
        options: [full, prices, triage, u11, media, sheets, materialize, u11specs, logos, probe, handoff, audit, auditspecs]
  push:
    paths: ["vehicle-data/refresh.request"]
  # schedule:
  #   - cron: "17 5 * * 0"   # weekly, Sunday 05:17 UTC

permissions:
  contents: write

concurrency:
  group: vehicle-refresh-${{ github.ref }}  # per branch: parallel workers never cancel or block the canonical branch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests beautifulsoup4 pillow cairosvg pymupdf
      - name: Refresh
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=$(awk 'NR==1{print $1}' vehicle-data/refresh.request); fi
          case "$MODE" in full|prices|triage|u11|media|sheets|materialize|u11specs|logos|probe|handoff|audit|auditspecs|*+*) ;; *) MODE=full ;; esac
          vehicle-data/scripts/refresh.sh "$MODE"
      - name: Upload raw pages (90-day artifact; evidence + parsed files are committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-pages-${{ github.run_id }}
          path: vehicle-data/snapshots/*/raw/
          retention-days: 90
          if-no-files-found: ignore
      - name: Commit snapshot and views
        run: |
          git config user.name "carindex-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vehicle-data/snapshots vehicle-data/views vehicle-data/review vehicle-data/media vehicle-data/registry
          git reset -q -- 'vehicle-data/snapshots/*/raw'
          git commit -m "vehicle-data refresh $(date -u +%Y-%m-%d) [automated]" || echo "nothing to commit"
          git fetch origin "${GITHUB_REF_NAME}"
          # derived files (views/registry outputs) may also change upstream: keep this run's copy, then rebuild them
          git rebase -X theirs "origin/${GITHUB_REF_NAME}"
          if [ -f vehicle-data/scripts/canonical.py ] && [ -d vehicle-data/inputs/u11 ]; then
            python3 vehicle-data/scripts/canonical.py
            git add vehicle-data/views vehicle-data/registry vehicle-data/review
            git commit -m "vehicle-data canonical rebuild after refresh [automated]" || echo "canonical unchanged"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
