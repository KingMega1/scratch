name: ops-vercel-docs
# Read-only evidence fetch of Vercel plan/limits documentation for the P0 (11 Nov 2026) incident report.
on:
  push:
    paths: ['web/ops/vercel-docs.request']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/ops/fetch-vercel-docs.mjs $(grep -v '^#' web/ops/vercel-docs.request)
