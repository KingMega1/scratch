}

a{color:var(--accent)}

header .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.logo img{height:26px;display:block}
nav{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto;max-width:100%}

nav a{white-space:nowrap;color:var(--slate);text-decoration:none;padding:12px 10px;font-weight:500;font-size:15px}

h2{font-size:22px}

p{margin:0}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}

th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}

  const mx = Math.max(1, ...funnel.map(k => c[k]||0));
  const heroes = {}; evs.filter(e=>e.type==='result_view' && e.props && e.props.top).forEach(e => { const h = e.props.top[0]; if (h) heroes[h] = (heroes[h]||0)+1; });
  adm.innerHTML = `<div class="row"><label style="font-weight:500"><input type="checkbox" id="regFlag" ${REG()?'checked':''}> ${lang==='ar'?'اعرض مؤشرات التسجيل (داخلي، حقوق النشر غير مؤكدة)':'Show registration signals (internal; publication rights unconfirmed)'}</label></div><p class="muted" style="font-size:13px">${lang==='ar'?'النطاق':'Scope'}: ${esc(scope)}</p>
   <div class="kpis">${[[lang==='ar'?'جلسات':'Sessions', sessions],[lang==='ar'?'رحلات بدأت':'Journeys started', c.journey_start||0],[lang==='ar'?'نتائج اتعرضت':'Results viewed', c.result_view||0],['👍 / 👎', `${up} / ${down}`],[lang==='ar'?'قائمة الانتظار':'Waitlist', wlN==null?(lang==='ar'?'للمحررين':'editors only'):wlN]].map(([k,v])=>`<div class="card kpi"><div class="muted" style="font-size:12px">${k}</div><div class="n">${v}</div></div>`).join('')}</div>
   <div class="card stack"><h3>${lang==='ar'?'الأحداث':'Events'}</h3>${funnel.map(k=>`<div class="bar-row"><span class="mono">${k}</span><span><i style="width:${(c[k]||0)/mx*100}%"></i></span><span class="num">${c[k]||0}</span></div>`).join('')}</div>
   <div class="card stack"><h3>${lang==='ar'?'أكتر ترشيح أول':'Most frequent top pick'}</h3>${Object.entries(heroes).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,n])=>`<div class="bar-row"><span>${esc(nm(byId[id])||id)}</span><span><i style="width:${n/Math.max(...Object.values(heroes))*100}%"></i></span><span class="num">${n}</span></div>`).join('') || '<p class="muted">—</p>'}</div>
   <div class="card stack"><h3>${lang==='ar'?'آخر التعليقات':'Latest comments'}</h3>${(fbs.length?fbs:evs.filter(e=>e.type==='feedback'&&e.props&&e.props.comment).map(e=>({vote:e.props.vote,comment:e.props.comment,t:e.t}))).slice(0,10).map(f=>`<div style="border-bottom:1px solid var(--line);padding-block:6px"><span>${f.vote==='up'?'👍':'👎'}</span> ${esc(f.comment)} <span class="muted num" style="font-size:11px">${esc((f.t||'').slice(0,16))}</span></div>`).join('') || '<p class="muted">—</p>'}</div>`;
}

document.addEventListener('change', e => { if (e.target && e.target.id === 'regFlag') { store.set('regFlag', e.target.checked); track('reg_flag', {on: e.target.checked}); } });
/* ---------- boot ---------- */
setLang(lang);
fetch('market.json').then(r => r.json()).then(d => { MARKET = d; render(); }).catch(() => {});
})();
</script>

</body></html>
