<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { direction: rtl; margin:0; width:1080px; height:1350px; background:#111111; color:#F9F9F7;
         font-family: 'Cairo', 'Segoe UI', sans-serif; box-sizing:border-box; padding:64px; }
  .logo { font-family:'Space Grotesk','Arial',sans-serif; font-weight:700; font-size:28px; }
  .logo .car { color:#F9F9F7; } .logo .index { color:#1477D1; }
  .role-tag { position:absolute; top:64px; right:64px; font-family:'JetBrains Mono',monospace; font-size:14px; opacity:.6; }
  .headline { font-family:'Cairo','Segoe UI',sans-serif; font-weight:700; font-size:56px; margin:120px 0 48px 0; line-height:1.3; }
  .bars { display:flex; flex-direction:column; gap:28px; margin-top:40px; }
  .bar-row { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding-bottom:20px; }
  .bar-label { font-family:'Cairo',sans-serif; font-size:26px; }
  .bar-value { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:40px; }
  .confirmed { color:#1477D1; }
  .crossed { text-decoration: line-through; opacity:.45; }
  .footer { position:absolute; bottom:56px; right:64px; left:64px; display:flex; justify-content:space-between;
            font-family:'JetBrains Mono',monospace; font-size:13px; opacity:.7; }
</style>
</head>
<body>
  <div class="logo"><span class="car">CAR</span><span class="index">INDEX</span></div>
  <div class="role-tag">4/7 — comparison (dark exception)</div>
  <div class="headline">لما مصدرين يختلفوا في رقم، إحنا مش بنختار واحد عشوائي ونمشي</div>
  <div class="bars">
    <div class="bar-row"><span class="bar-label">SOURCE A</span><span class="bar-value crossed">1,850,000</span></div>
    <div class="bar-row"><span class="bar-label">SOURCE B</span><span class="bar-value crossed">1,790,000</span></div>
    <div class="bar-row"><span class="bar-label">SOURCE C — Official Distributor</span><span class="bar-value confirmed">1,820,000 EGP ✓</span></div>
  </div>
  <div class="footer"><span>Conflicting sources get checked, not picked.</span><span>Source: CarIndex</span></div>
</body>
</html>
