<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { direction: rtl; margin:0; width:1080px; height:1350px; background:#F9F9F7; color:#111111;
         font-family:'Cairo','Segoe UI',sans-serif; box-sizing:border-box; padding:64px; }
  .logo { font-family:'Space Grotesk','Arial',sans-serif; font-weight:700; font-size:28px; }
  .logo .car { color:#111111; } .logo .index { color:#1477D1; }
  .role-tag { position:absolute; top:64px; right:64px; font-family:'JetBrains Mono',monospace; font-size:14px; opacity:.5; }
  .img-placeholder { width:100%; height:540px; background:#e5e7eb; border-radius:12px; margin-top:110px; }
  .hero-number { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:130px; color:#111111; margin-top:44px; }
  .hero-label { font-family:'Cairo',sans-serif; font-size:32px; margin-top:8px; }
  .sub-row { font-family:'Cairo',sans-serif; font-size:24px; color:#6B6B6B; margin-top:36px; }
  .footer { position:absolute; bottom:56px; right:64px; left:64px; display:flex; justify-content:space-between;
            font-family:'JetBrains Mono',monospace; font-size:13px; opacity:.6; }
</style>
</head>
<body>
  <div class="logo"><span class="car">CAR</span><span class="index">INDEX</span></div>
  <div class="role-tag">2/7 — hero_stat (default light)</div>
  <div class="img-placeholder"></div>
  <div class="hero-number">340,000</div>
  <div class="hero-label">جنيه أكبر تخفيض على السيارات الجديدة في مصر</div>
  <div class="sub-row">شامل ٨ موديلات خلال ٤٨ ساعة</div>
  <div class="footer"><span>اسحب ←</span><span>Source: CarIndex</span></div>
</body>
</html>
