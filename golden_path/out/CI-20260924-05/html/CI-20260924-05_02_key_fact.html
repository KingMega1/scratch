<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  body { margin:0; }
  .slide { width:1080px; height:1350px; position:relative; overflow:hidden; background:#1D6FE0; color:#FFFFFF; font-family:'Poppins',sans-serif; display:flex; flex-direction:column; box-sizing:border-box; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:36px 48px 0; position:relative; z-index:2; }
  .top img { height:32px; width:auto; }
  .count { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; color:rgba(255,255,255,0.55); }
  .main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 48px; gap:28px; position:relative; z-index:2; }
  .ar { direction:rtl; font-family:'Cairo',sans-serif; }
  .en { font-family:'Poppins',sans-serif; color:rgba(255,255,255,0.55); }
  .kicker { font-family:'JetBrains Mono',monospace; font-size:16px; letter-spacing:0.16em; text-transform:uppercase; color:#1D6FE0; }
  .num { font-family:'JetBrains Mono',monospace; font-weight:700; }
  .unit { font-family:'JetBrains Mono',monospace; font-weight:500; opacity:0.7; }
  .na { font-family:'Cairo',sans-serif; font-weight:700; color:#B7791F; background:rgba(255,176,32,0.14); padding:2px 10px; }
  .na-big { font-size:44px; }
  .foot { padding:0 48px 34px; font-family:'JetBrains Mono',monospace; font-size:15px; color:rgba(255,255,255,0.55); display:flex; justify-content:space-between; gap:24px; position:relative; z-index:2; }
  .clip { overflow:hidden; }
</style>
</head>
<body>
<div class="slide" data-slide="2">
  <div class="top"><img src="file:///home/user/scratch/golden_path/assets/carindex-logo-white.png" alt="CARINDEX"><div class="count">2/6</div></div>
  
  <div class="main">
    <div class="kicker" style="color:rgba(255,255,255,0.8);">MG ZS licenses in August</div>
    <div class="ar" style="font-weight:700; font-size:36px; color:rgba(255,255,255,0.9);">تراخيص MG ZS في أغسطس</div>
    <div style="font-size:150px; line-height:0.95; letter-spacing:-0.03em; color:#FFFFFF;"><span class="num">647</span> <span class="unit">units</span></div>
    <div class="ar" style="font-weight:600; font-size:24px; color:rgba(255,255,255,0.75);">تراخيص MG ZS في أغسطس <span style="font-family:'Poppins',sans-serif; font-size:18px;">· MG ZS licenses, August</span></div>
    <div style="height:2px; background:rgba(255,255,255,0.25);"></div>
    <div class="ar clip" style="font-weight:600; font-size:30px; line-height:1.55; max-height:190px;">MG كلها رخصت 2,326 عربية ملاكي، وMG GT جت بعدها بـ452.</div>
    <div class="en clip" style="font-size:22px; line-height:1.5; color:rgba(255,255,255,0.7); max-height:100px;">MG licensed 2,326 passenger cars in total; the MG GT added 452.</div>
  </div>
  <div class="foot"><span>Source: Egypt Automotive · 2026-09-19</span><span>BUYER CHECK</span></div>
</div>
</body>
</html>
