<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  body { margin:0; }
  .slide { width:1080px; height:1350px; position:relative; overflow:hidden; background:#0B0E1A; color:#FFFFFF; font-family:'Poppins',sans-serif; display:flex; flex-direction:column; box-sizing:border-box; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:36px 48px 0; position:relative; z-index:2; }
  .top img { height:32px; width:auto; }
  .count { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; color:rgba(255,255,255,0.55); }
  .main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 48px; gap:28px; position:relative; z-index:2; }
  .ar { direction:rtl; font-family:'Cairo',sans-serif; }
  .en { font-family:'Poppins',sans-serif; color:rgba(255,255,255,0.55); }
  .kicker { font-family:'JetBrains Mono',monospace; font-size:16px; letter-spacing:0.16em; text-transform:uppercase; color:#1D6FE0; }
  .num { font-family:'JetBrains Mono',monospace; font-weight:700; }
  .unit { font-family:'JetBrains Mono',monospace; font-weight:500; opacity:0.7; }
  .na { font-family:'Cairo',sans-serif; font-weight:700; color:#B7791F; background:rgba(255,176,32,0.14); padding:2px 10px; }
  .na-big { font-size:44px; }
  .foot { padding:0 48px 34px; font-family:'JetBrains Mono',monospace; font-size:15px; color:rgba(255,255,255,0.55); display:flex; justify-content:space-between; gap:24px; position:relative; z-index:2; }
  .clip { overflow:hidden; }
</style>
</head>
<body>
<div class="slide" data-slide="1">
  <div class="top"><img src="file:///home/user/scratch/golden_path/assets/carindex-logo-white.png" alt="CARINDEX"><div class="count">1/6</div></div>
  
  <div style="position:absolute; inset:0; z-index:1;">
    <img src="" alt="BAIC U5 Plus Manual" style="position:absolute; top:0; left:0; width:1080px; height:860px; object-fit:cover;">
    <div style="position:absolute; top:0; left:0; right:0; height:200px; background:linear-gradient(180deg, rgba(11,14,26,0.65), rgba(11,14,26,0));"></div>
    <div style="position:absolute; top:560px; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(11,14,26,0) 0%, #0B0E1A 44%);"></div>
  </div>
  <div class="main" style="justify-content:flex-end; padding-bottom:26px; gap:18px;">
    <div class="kicker" style="color:#7FB0F0;">Buyer Check · BAIC U5 Plus Manual</div>
    <div class="ar clip" style="font-weight:800; font-size:64px; line-height:1.2; max-height:236px;">بايك U5 Plus بقت مانيوال بـ695,000 جنيه</div>
    <div class="en clip" style="font-weight:600; font-size:28px; line-height:1.35; color:rgba(255,255,255,0.72); max-height:80px;">BAIC U5 Plus now has a manual trim at EGP 695,000</div>
    <div style="display:flex; align-items:baseline; gap:14px; border-top:2px solid #1D6FE0; padding-top:18px; font-size:44px;"><span class="num">695,000</span> <span class="unit">EGP</span><span class="ar" style="font-size:22px; color:rgba(255,255,255,0.6);">سعر فئة المانيوال</span></div>
  </div>
  <div class="foot"><span>Image: </span><span>BUYER CHECK</span></div>
</div>
</body>
</html>
